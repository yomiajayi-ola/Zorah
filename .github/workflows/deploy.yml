name: Continuous Deployment

on:
  push:
    branches: [ main, staging ]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pre-Deployment Test Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify JavaScript syntax
        run: node -c src/app.js src/models/*.js src/controllers/*.js src/routes/*.js

      - name: Run automated test suite
        run: node src/tests/owambeDebt.test.js

  deploy:
    name: Deploy to EC2
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Record Start Time & Set Environment Variables
        run: |
          echo "START_TIME=$(date +%s)" >> $GITHUB_ENV
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "TARGET_ENV=production" >> $GITHUB_ENV
            echo "PM2_NAME=zorah-backend" >> $GITHUB_ENV
            echo "BRANCH=main" >> $GITHUB_ENV
          elif [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            echo "TARGET_ENV=staging" >> $GITHUB_ENV
            echo "PM2_NAME=zorah-staging" >> $GITHUB_ENV
            echo "BRANCH=staging" >> $GITHUB_ENV
          else
            echo "TARGET_ENV=production" >> $GITHUB_ENV
            echo "PM2_NAME=zorah-backend" >> $GITHUB_ENV
            echo "BRANCH=main" >> $GITHUB_ENV
          fi

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: TARGET_ENV,PM2_NAME,BRANCH
          script: |
            set -e
            cd /home/ec2-user/Zorah
            chmod +x scripts/deploy-reload.sh
            ./scripts/deploy-reload.sh $BRANCH $PM2_NAME

      - name: Generate Deployment Summary & Metrics
        if: always()
        run: |
          END_TIME=$(date +%s)
          START_TIME=${START_TIME:-$END_TIME}
          DURATION=$((END_TIME - START_TIME))
          
          if [ "${{ job.status }}" = "success" ]; then
            STATUS_ICON="✅"
            STATUS_TEXT="Success"
          else
            STATUS_ICON="❌"
            STATUS_TEXT="Failure / Rolled Back"
          fi
          
          PORT="4000"
          if [ "$TARGET_ENV" = "staging" ]; then
            PORT="4001"
          fi
          
          UTC_NOW=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          echo "### $STATUS_ICON Deployment Summary - $TARGET_ENV" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric / Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployment Status** | $STATUS_ICON $STATUS_TEXT |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Environment** | \`$TARGET_ENV\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **PM2 Process Name** | \`$PM2_NAME\` (Port $PORT) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Branch** | \`$BRANCH\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Git Commit SHA** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered By** | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Execution Duration** | \`${DURATION}s\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Timestamp (UTC)** | \`$UTC_NOW\` |" >> $GITHUB_STEP_SUMMARY
          
          echo "----------------------------------------------------------------------"
          echo "📊 Deployment Execution Duration: ${DURATION}s"
          echo "----------------------------------------------------------------------"
